name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify go.mod
        run: make mod-tidy-check
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
      - name: Test
        run: go test -coverprofile=coverage.out ./...
      - name: Core WASM test
        run: make test-core-wasm
      - name: Race test
        run: make test-race
      - name: Build
        run: make build
      - name: Build WASM stub
        run: make build-wasm
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage.out
        continue-on-error: true

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-platform build
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean
