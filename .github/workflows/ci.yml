name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: go test -coverprofile=coverage.out ./...
      - name: Core WASM test
        run: make test-core-wasm
      - name: Race test
        run: make test-race
      - name: Build
        run: make build
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
        continue-on-error: true
