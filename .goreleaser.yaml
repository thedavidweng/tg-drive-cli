version: 2
project_name: td

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
      # Each cross-compiled go build can balloon past 3 GiB of heap
      # (modernc.org/sqlite is heavy to compile) and the default GC lets
      # four parallel builds OOM a 16 GiB runner. Cap each build's heap
      # so six targets fit in memory; GC trades a little CPU for the
      # headroom.
      - GOMEMLIMIT=3GiB
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/td
    binary: td
    ldflags:
      - -s -w
      - -X github.com/thedavidweng/tg-drive-cli/internal/version.Version={{.Version}}
      - -X github.com/thedavidweng/tg-drive-cli/internal/version.Commit={{.Commit}}
      - -X github.com/thedavidweng/tg-drive-cli/internal/version.Date={{.Date}}
      - -X github.com/thedavidweng/tg-drive-cli/internal/version.BuiltBy=goreleaser

universal_binaries:
  - replace: true

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64"}}x86_64
      {{- else if eq .Arch "all"}}universal
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    artifacts: checksum
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

sboms:
  - cmd: syft
    artifacts: archive
    args:
      - ${artifact}
      - --output
      - spdx-json=${document}
    documents:
      - ${artifact}.spdx.json

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  github:
    owner: thedavidweng
    name: tg-drive-cli
  mode: append
  draft: false
  prerelease: auto
  header: |
    ## What's Changed

    Full release notes are auto-generated below.
  footer: |
    ---
    **Install:**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/thedavidweng/tg-drive-cli/main/install.sh | sh
    ```

nfpms:
  - package_name: td
    vendor: thedavidweng
    maintainer: thedavidweng <noreply@github.com>
    homepage: https://github.com/thedavidweng/tg-drive-cli
    description: Telegram-backed virtual file tree CLI
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

# The Homebrew cask is maintained pull-based: the tap repository's Sync
# Releases workflow updates Casks/tg-drive-cli.rb from the published release
# assets, so this pipeline needs no cross-repository token.
